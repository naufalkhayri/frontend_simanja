<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Login Simanja</title>
</head>
<body class="bg-green-50 bg-cover bg-center">

    <!-- Login Section -->
    <section class="min-h-screen flex items-center justify-center">
        <div class="bg-green-100 flex rounded-2xl shadow-lg max-w-3xl p-5 items-center">
            <!-- Form -->
            <div class="md:w-1/2 px-8">
                <h2 class="font-bold text-2xl text-green-900">Masuk</h2>
                <p class="text-sm mt-4 text-green-900">Jika sudah menjadi member, akses mudah Login</p>

                <form id="loginForm" class="flex flex-col gap-4 mt-8">
                    <div>
                        <input class="p-2 rounded-xl border w-full" type="text" name="username" placeholder="Username atau Email" required>
                        <p id="usernameError" class="text-red-500 text-xs mt-1 hidden">Username atau email harus diisi</p>
                    </div>
                    
                    <div class="relative">
                        <input id="passwordInput" class="p-2 rounded-xl border w-full" type="password" name="password" placeholder="Sandi" required>
                        <button type="button" id="togglePassword" class="absolute top-1/2 right-3 -translate-y-1/2 text-gray-500">
                            <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                                <path d="M10.5 8a2.5 2.5 0 1 1-5 0 2.5 2.5 0 0 1 5 0"/>
                                <path d="M0 8s3-5.5 8-5.5S16 8 16 8s-3 5.5-8 5.5S0 8 0 8m8 3.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7"/>
                            </svg>
                        </button>
                        <p id="passwordError" class="text-red-500 text-xs mt-1 hidden">Password harus diisi</p>
                    </div>

                    <button type="submit" class="bg-green-900 rounded-xl text-white py-2 hover:scale-105 duration-300 flex items-center justify-center">
                        <span id="buttonText">Masuk</span>
                        <div id="loadingSpinner" class="hidden ml-2">
                            <div class="animate-spin rounded-full h-4 w-4 border-b-2 border-white"></div>
                        </div>
                    </button>

                    <div id="errorMessage" class="text-red-500 text-sm text-center hidden"></div>
                </form>

                <div class="mt-3 text-xs flex justify-between items-center text-green-900">
                    <p>Belum punya akun?</p>
                    <a href="register.html" class="py-2 px-5 bg-white border rounded-xl hover:scale-110 duration-300 inline-block text-center hover:bg-green-50">Register</a>
                </div>
            </div>

            <!-- Image -->
            <div class="md:block hidden w-1/2">
                <img class="rounded-2xl object-cover h-full w-full" src="gambarduit.jpg" alt="Ilustrasi Keuangan">
            </div>
        </div>
    </section>

    <script src="./assets/js/login.js"></script>
</body>
</html>
